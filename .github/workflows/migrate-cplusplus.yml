# Bootstrap migration: once C++ is canonical here, future content edits happen in MainCourse first.
name: Migrate C++ into MainCourse

on:
  push:
    paths:
      - '.github/workflows/migrate-cplusplus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MainCourse
        uses: actions/checkout@v4

      - name: Checkout C++ source package
        uses: actions/checkout@v4
        with:
          repository: waxew/AS-Academy-Cplusplus
          path: source-cpp

      - name: Migrate canonical C++ package
        run: |
          rm -rf courses/cplusplus/course
          mkdir -p courses/cplusplus/course
          cp -a source-cpp/course/cpp/. courses/cplusplus/course/
          cat > courses/cplusplus/README.md <<'EOF'
          # C++ — MainCourse

          `courses/cplusplus/course` is the canonical educational package for AS Academy C++.

          Initial migration source: `waxew/AS-Academy-Cplusplus/course/cpp`.
          After bootstrap migration, all lesson, quiz, exercise, project, glossary and assessment edits must be authored here first.
          The C++ application consumes this package at build time and must not maintain an independent curriculum fork.
          EOF
          rm -rf source-cpp

      - name: Commit migrated content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses/cplusplus
          if git diff --cached --quiet; then
            echo 'C++ MainCourse already synchronized.'
          else
            git commit -m 'feat(courses): migrate C++ course into MainCourse'
            git push
          fi
