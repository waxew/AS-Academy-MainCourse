name: Validate Basic Course Package

on:
  push:
    branches: [main]
    paths:
      - "courses/basic/**"
      - ".github/workflows/validate-basic.yml"
  pull_request:
    paths:
      - "courses/basic/**"
      - ".github/workflows/validate-basic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maincourse-basic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Core validate Basic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MainCourse
        uses: actions/checkout@v5
        with:
          path: AS-Academy-MainCourse

      - name: Checkout pinned AS Academy Core
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-Core
          ref: 3cd7ad0a0aec73d6d1fb56e9a306fa48a2c1765c
          path: AS-Academy-Core

      - name: Verify Core/MainCourse compatibility contract
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("AS-Academy-Core/integration/contract.json").read_text())
          manifest = json.loads(Path("AS-Academy-MainCourse/courses/basic/course/manifest.json").read_text())

          missing = [k for k in contract["courseManifestRequiredFields"] if k not in manifest]
          if missing:
              raise SystemExit(f"Basic manifest missing required contract fields: {missing}")
          if manifest["contentSchemaVersion"] != contract["contentSchemaVersion"]:
              raise SystemExit(
                  f"Schema mismatch: course={manifest['contentSchemaVersion']} core={contract['contentSchemaVersion']}"
              )
          print(
              f"Integration contract OK: Core {contract['coreVersion']} / schema {contract['contentSchemaVersion']}"
          )
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate canonical Basic Course Package
        working-directory: AS-Academy-Core
        run: ./gradlew :tools:run --args="validate ../AS-Academy-MainCourse/courses/basic/course" --stacktrace
