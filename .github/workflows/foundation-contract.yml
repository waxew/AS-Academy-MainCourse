name: Foundation Contract

on:
  push:
    branches:
      - main
      - integration/**
      - feat/**
  pull_request:

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate MainCourse manifests against foundation contract
        run: python integration/validate_contract.py
