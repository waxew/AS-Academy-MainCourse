name: Publish Basic Runtime Content

on:
  push:
    branches: [main]
    paths:
      - "courses/basic/**"
      - ".github/workflows/publish-basic-content.yml"
  pull_request:
    paths:
      - "courses/basic/**"
      - ".github/workflows/publish-basic-content.yml"
  workflow_dispatch:

concurrency:
  group: maincourse-basic-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-channel:
    name: Validate and build Basic content channel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout MainCourse
        uses: actions/checkout@v5
        with:
          path: AS-Academy-MainCourse

      # Runtime content must be built with an immutable merged Core input so a published hash can be reproduced.
      - name: Checkout AS Academy Core
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-Core
          ref: d8b42beb42894452d9420b8bf3200847c6294fb9
          path: AS-Academy-Core

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate canonical Basic Course Package
        working-directory: AS-Academy-Core
        run: ./gradlew :tools:run --args="validate ../AS-Academy-MainCourse/courses/basic/course" --stacktrace

      - name: Compile Basic runtime package
        working-directory: AS-Academy-Core
        run: |
          mkdir -p ../AS-Academy-MainCourse/dist/basic
          ./gradlew :tools:run --args="compile ../AS-Academy-MainCourse/courses/basic/course ../AS-Academy-MainCourse/dist/basic/basic-course.json" --stacktrace

      - name: Generate release metadata and SHA-256
        working-directory: AS-Academy-MainCourse
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path("courses/basic/course/manifest.json")
          package_path = Path("dist/basic/basic-course.json")
          metadata_path = Path("dist/basic/latest.json")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          digest = hashlib.sha256(package_path.read_bytes()).hexdigest()
          metadata = {
              "courseId": manifest["courseId"],
              "version": manifest["version"],
              "minimumCoreVersion": manifest["minimumCoreVersion"],
              "sha256": digest,
              "downloadUrl": "https://github.com/waxew/AS-Academy-MainCourse/releases/download/basic-content/basic-course.json",
          }
          metadata_path.write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("dist/basic/basic-course.json.sha256").write_text(
              f"{digest}  basic-course.json\n",
              encoding="utf-8",
          )
          print(json.dumps(metadata, ensure_ascii=False, indent=2))
          PY

      - name: Verify metadata matches generated package
        working-directory: AS-Academy-MainCourse
        shell: bash
        run: |
          EXPECTED=$(python3 -c 'import json; print(json.load(open("dist/basic/latest.json", encoding="utf-8"))["sha256"])')
          ACTUAL=$(sha256sum dist/basic/basic-course.json | awk '{print $1}')
          test "$EXPECTED" = "$ACTUAL"

      - name: Upload channel QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: basic-content-channel-${{ github.sha }}
          path: |
            AS-Academy-MainCourse/dist/basic/basic-course.json
            AS-Academy-MainCourse/dist/basic/basic-course.json.sha256
            AS-Academy-MainCourse/dist/basic/latest.json
          if-no-files-found: error

  publish-channel:
    name: Publish rolling Basic content release
    needs: build-channel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout MainCourse
        uses: actions/checkout@v5

      - name: Download validated channel artifact
        uses: actions/download-artifact@v5
        with:
          name: basic-content-channel-${{ github.sha }}
          path: dist/basic

      - name: Create or update rolling release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view basic-content >/dev/null 2>&1; then
            gh release create basic-content \
              --target "$GITHUB_SHA" \
              --title "Basic Runtime Content Channel" \
              --notes "Rolling validated Course Package for AS Academy Basic. Source of truth: courses/basic/course."
          fi
          gh release upload basic-content \
            dist/basic/basic-course.json \
            dist/basic/basic-course.json.sha256 \
            dist/basic/latest.json \
            --clobber
