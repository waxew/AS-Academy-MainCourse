name: Validate all canonical Course packages

on:
  push:
    branches: [main, integration/core-mainui]
    paths:
      - "courses/**"
      - ".github/workflows/validate-all-courses.yml"
  pull_request:
    paths:
      - "courses/**"
      - ".github/workflows/validate-all-courses.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maincourse-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate canonical packages with Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MainCourse
        uses: actions/checkout@v5
        with:
          path: AS-Academy-MainCourse

      - name: Checkout AS Academy Core
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-Core
          ref: ${{ github.ref_name == 'integration/core-mainui' && 'integration/mainui-maincourse' || 'main' }}
          path: AS-Academy-Core

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate every Course source of truth
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r course_dir; do
            if [[ ! -f "AS-Academy-MainCourse/$course_dir/manifest.json" ]]; then
              continue
            fi
            count=$((count + 1))
            echo "::group::Validate $course_dir"
            ./AS-Academy-Core/gradlew -p AS-Academy-Core :tools:run \
              --args="validate ../AS-Academy-MainCourse/$course_dir" --stacktrace
            echo "::endgroup::"
          done < <(find AS-Academy-MainCourse/courses -mindepth 2 -maxdepth 2 -type d -name course -printf '%P\n' | sort)

          if [[ "$count" -eq 0 ]]; then
            echo "No canonical courses/*/course/manifest.json packages were found." >&2
            exit 1
          fi

          echo "Validated $count canonical Course package(s)."
