name: Validate all canonical Course packages

on:
  push:
    branches: [main, integration/core-mainui]
    paths:
      - "courses/**"
      - ".github/workflows/validate-all-courses.yml"
  pull_request:
    paths:
      - "courses/**"
      - ".github/workflows/validate-all-courses.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maincourse-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate canonical packages with Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MainCourse
        uses: actions/checkout@v5
        with:
          path: AS-Academy-MainCourse

      - name: Checkout AS Academy Core
        uses: actions/checkout@v5
        with:
          repository: waxew/AS-Academy-Core
          ref: ${{ github.ref_name == 'integration/core-mainui' && 'integration/mainui-maincourse' || 'main' }}
          path: AS-Academy-Core

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate canonical Course sources and report legacy packages
        shell: bash
        run: |
          set -euo pipefail
          canonical_count=0
          legacy_count=0

          while IFS= read -r course_dir; do
            manifest="$course_dir/manifest.json"
            [[ -f "$manifest" ]] || continue
            relative_dir="${course_dir#AS-Academy-MainCourse/}"

            if grep -q '"courseId"' "$manifest" && grep -q '"contentSchemaVersion"' "$manifest"; then
              canonical_count=$((canonical_count + 1))
              echo "::group::Validate canonical $relative_dir"
              ./AS-Academy-Core/gradlew -p AS-Academy-Core :tools:run \
                --args="validate ../AS-Academy-MainCourse/$relative_dir" --stacktrace
              echo "::endgroup::"
            else
              legacy_count=$((legacy_count + 1))
              echo "::warning file=$manifest::Legacy Course manifest is not yet on the Core contract: $relative_dir"
            fi
          done < <(find AS-Academy-MainCourse/courses -mindepth 2 -maxdepth 2 -type d -name course | sort)

          if [[ "$canonical_count" -eq 0 ]]; then
            echo "No Core-contract canonical Course package was found." >&2
            exit 1
          fi

          {
            echo "## MainCourse contract validation"
            echo "- Canonical packages validated: $canonical_count"
            echo "- Legacy packages pending migration: $legacy_count"
          } >> "$GITHUB_STEP_SUMMARY"
